# ===================================================================
# Smart Dairy Management System - Supabase Cloud PostgreSQL Config
# ===================================================================
# To activate: run with -Dspring-boot.run.profiles=supabase
# or set SPRING_PROFILES_ACTIVE=supabase

server.port=8080

# Replace [YOUR-PASSWORD] and [YOUR-SUPABASE-HOST] from your Supabase Dashboard:
# Project Settings -> Database -> Connection String -> URI / JDBC
spring.datasource.url=jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=YOUR_SUPABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=SupabaseHikariCP
