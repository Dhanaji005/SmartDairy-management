# ===================================================================
# Smart Dairy Management System - Default Local Configuration
# ===================================================================

server.port=8080

# Application Name
spring.application.name=smart-dairy-backend

# Default Database: In-memory/file H2 for instant local development
spring.datasource.url=jdbc:h2:file:./data/smartdairy_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false
