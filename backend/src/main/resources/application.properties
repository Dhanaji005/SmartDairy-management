# ===================================================================
# Smart Dairy Management System - Default Configuration
# ===================================================================

server.port=${PORT:8080}

# Application Name
spring.application.name=smart-dairy-backend

# Database Configuration:
# Defaults to local file H2 database, or uses SPRING_DATASOURCE_URL if provided in environment / .env
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/smartdairy_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# H2 Console (available at http://localhost:8080/h2-console when using H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false
